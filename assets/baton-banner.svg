<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">baton — Pass the baton, never the secret.</title>
  <desc id="desc">A gold relay baton on a dark background. Local authentication for agents, through CLI, MCP, and remote HTTPS.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111a20"/><stop offset="1" stop-color="#0b1116"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#e9b866" stop-opacity=".15"/><stop offset="1" stop-color="#e9b866" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold"><stop stop-color="#98612c"/><stop offset=".2" stop-color="#e4ad58"/><stop offset=".42" stop-color="#fff0bb"/><stop offset=".62" stop-color="#edc67e"/><stop offset="1" stop-color="#ad7435"/></linearGradient>
    <linearGradient id="cap" x2="0" y2="1"><stop stop-color="#fff1c4"/><stop offset="1" stop-color="#c18b43"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d8e1e6" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#background)"/>
    <path d="M720 0H1200V380H720Z" fill="url(#grid)"/>
    <ellipse cx="966" cy="185" rx="260" ry="240" fill="url(#halo)"/>
    <path d="M0 1H1200" stroke="#edc67e" stroke-opacity=".35"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <circle cx="63" cy="49" r="5" fill="#edc67e"/>
      <text x="81" y="54" font-size="14" font-weight="600" letter-spacing="2.4" fill="#b2bec5">AUTHENTICATION FOR AGENTS</text>
      <text x="49" y="177" font-size="122" font-weight="700" letter-spacing="-6" fill="#f8f3e9">baton</text>
      <text x="56" y="237" font-size="30" font-weight="500" letter-spacing="-.5" fill="#f8f3e9">Pass the baton, never the secret.</text>
      <text x="57" y="276" font-size="19" fill="#a1afb8">One vault. Temporary access. Your tools.</text>
      <g fill="#17232b" stroke="#34424b"><rect x="56" y="315" width="55" height="27" rx="6"/><rect x="121" y="315" width="64" height="27" rx="6"/><rect x="195" y="315" width="137" height="27" rx="6"/></g>
      <g fill="#c4cfd6" font-size="11" font-weight="600" letter-spacing="1.3" text-anchor="middle"><text x="84" y="333">CLI</text><text x="153" y="333">MCP</text><text x="264" y="333">REMOTE HTTPS</text></g>
    </g>
    <g fill="none">
      <circle cx="962" cy="184" r="126" stroke="#d4bb8a" stroke-opacity=".16"/>
      <circle cx="962" cy="184" r="108" stroke="#d4bb8a" stroke-opacity=".2" stroke-dasharray="2 9"/>
      <path d="M862 108A126 126 0 0 1 1028 77M1067 254A126 126 0 0 1 901 294" stroke="#edc67e" stroke-opacity=".65" stroke-width="2"/>
      <path d="M796 88H832L866 122M1056 111L1080 88H1125M1046 277L1064 295H1125" stroke="#5c6059"/>
    </g>
    <g fill="#111a20" stroke="#d5b579"><circle cx="796" cy="88" r="5"/><circle cx="1125" cy="88" r="5"/><circle cx="1125" cy="295" r="5"/></g>
    <g transform="translate(962 183) rotate(35)">
      <rect x="-15" y="-101" width="45" height="218" rx="22" fill="#000" opacity=".24"/>
      <rect x="-23" y="-111" width="46" height="222" rx="22" fill="url(#gold)" stroke="#f6da9a" stroke-opacity=".6"/>
      <ellipse cy="-99" rx="22" ry="11" fill="url(#cap)"/>
      <path d="M-11 -80V85" stroke="#fff5d7" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <path d="M16 -78V82" stroke="#775020" stroke-width="2" stroke-linecap="round" opacity=".35"/>
      <path d="M-21 71Q0 80 21 71M-21 77Q0 86 21 77" fill="none" stroke="#8a5d2c" opacity=".3"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <rect x="799" y="280" width="134" height="31" rx="7" fill="#19252b" stroke="#746444"/>
      <circle cx="814" cy="295" r="3" fill="#edc67e"/>
      <text x="826" y="299" font-size="11" font-weight="600" letter-spacing="1" fill="#f1d7a5">SCOPED LEASE</text>
      <text x="962" y="346" text-anchor="middle" font-size="11" letter-spacing="2.1" fill="#9b9d91">ACCESS, ON YOUR TERMS</text>
    </g>
  </g>
