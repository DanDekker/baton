<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">baton</title>
  <desc id="desc">Auth contexts for agents. Pass the baton, never the secret.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 78) rotate(90) scale(260 350)">
      <stop stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#744414"/>
      <stop offset=".18" stop-color="#c88b31"/>
      <stop offset=".42" stop-color="#fff1ba"/>
      <stop offset=".61" stop-color="#e5ad50"/>
      <stop offset="1" stop-color="#8f581b"/>
    </linearGradient>
    <radialGradient id="gold-cap">
      <stop stop-color="#fff6d1"/>
      <stop offset=".65" stop-color="#dfaa4e"/>
      <stop offset="1" stop-color="#8f5518"/>
    </radialGradient>
    <filter id="baton-shadow" x="-70%" y="-30%" width="240%" height="170%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <path d="M785 0v300M865 0v300M945 0v300M1025 0v300M1105 0v300" stroke="#ffffff" stroke-opacity=".06"/>
    <path d="M740 72h398M740 150h398M740 228h398" stroke="#ffffff" stroke-opacity=".06"/>

    <rect x="67" y="76" width="144" height="144" rx="34" fill="#252525" stroke="#484848" stroke-width="2"/>
    <g transform="translate(139 148) rotate(45)">
      <rect x="-16" y="-59" width="37" height="119" rx="16" fill="#000000" opacity=".5" filter="url(#baton-shadow)"/>
      <rect x="-15" y="-58" width="30" height="116" rx="14" fill="url(#gold-body)" stroke="#6c3f11" stroke-width="1.5"/>
      <path d="M-7 -43v86" stroke="#fff6d6" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
      <path d="M9 -44v88" stroke="#5d340d" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="0" cy="-55" rx="14" ry="6" fill="url(#gold-cap)"/>
      <ellipse cx="0" cy="55" rx="14" ry="6" fill="url(#gold-cap)"/>
    </g>

    <text x="252" y="94" fill="#b9b9b9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="3.5">AUTH CONTEXTS FOR AGENTS</text>
    <text x="246" y="184" fill="#f6f6f6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="82" font-weight="750" letter-spacing="-3">baton</text>
    <text x="251" y="229" fill="#c8c8c8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Pass the baton, never the secret.</text>

    <path d="M849 121l47-47m-47 126l125-126m-47 126l125-126m-47 126l125-126" stroke="#ffffff" stroke-opacity=".07" stroke-width="16" stroke-linecap="round"/>
    <path d="M0 298h1200" stroke="#ffffff" stroke-opacity=".14" stroke-width="4"/>
  </g>
</svg>
