<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 684" role="img" aria-labelledby="title desc">
  <title id="title">Store. Grant. Use.</title>
  <desc id="desc">Store credentials in an encrypted vault. Grant scoped, expiring access. Run commands or HTTPS requests with known secrets redacted from results.</desc>
  <rect x=".5" y=".5" width="399" height="683" rx="16" fill="#f5f2e9" stroke="#ddd8ca"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="24" y="30" font-size="12" font-weight="700" letter-spacing="2" fill="#6d7063">THE HANDOFF</text>
    <g fill="#fffef9" stroke="#dedbd0"><rect x="16" y="50" width="368" height="178" rx="12"/><rect x="16" y="266" width="368" height="178" rx="12"/><rect x="16" y="482" width="368" height="178" rx="12"/></g>
    <g fill="none" stroke="#8b8d81" stroke-width="1.5"><path d="M200 238V256M195 251L200 256L205 251M200 454V472M195 467L200 472L205 467"/></g>
    <g fill="#edc67e"><rect x="36" y="74" width="32" height="27" rx="6"/><rect x="36" y="290" width="32" height="27" rx="6"/><rect x="36" y="506" width="32" height="27" rx="6"/></g>
    <g fill="#59421f" font-size="12" font-weight="700" text-anchor="middle"><text x="52" y="92">01</text><text x="52" y="308">02</text><text x="52" y="524">03</text></g>
    <g fill="#18242b" font-size="25" font-weight="650"><text x="83" y="96">Store</text><text x="83" y="312">Grant</text><text x="83" y="528">Use</text></g>
    <g fill="#28362f" font-size="19" font-weight="500"><text x="36" y="140">An encrypted vault</text><text x="36" y="356">Access with an expiry</text><text x="36" y="572">Your tools, authenticated</text></g>
    <g fill="#6a746a" font-size="16">
      <text x="36" y="174">Add a token or import a login.</text><text x="36" y="201">Secrets stay with the broker.</text>
      <text x="36" y="390">Choose the service and use limit.</text><text x="36" y="417">Revoke it when the job is done.</text>
      <text x="36" y="606">Run a command or HTTPS request.</text><text x="36" y="633">Known secrets are redacted.</text>
    </g>
  </g>
</svg>
