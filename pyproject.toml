[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baton-auth"
description = "Local authentication broker for AI agents and MCP tools"
version = "0.1.1"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["AI agents", "authentication", "MCP", "credential management", "secrets management"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography>=45",
  "blake3>=1.0",
  "argon2-cffi>=25",
  "keyring>=24",
  "mcp>=2.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/DanDekker/baton"
Documentation = "https://github.com/DanDekker/baton/blob/master/docs/guide.md"
Issues = "https://github.com/DanDekker/baton/issues"
Source = "https://github.com/DanDekker/baton"

[project.scripts]
baton = "baton_auth.cli:main"
baton-auth = "baton_auth.cli:main"
baton-mcp = "baton_auth.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/baton_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
