[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baton"
description = "Auth-context broker and lease server for agents: pass handles, never secrets"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=45",
  "blake3>=1.0",
  "argon2-cffi>=25",
  "keyring>=24",
  "mcp>=2.0",
  "httpx>=0.27",
]

[project.scripts]
baton = "baton.cli:main"
baton-mcp = "baton.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
